[build]
  publish = "dist"
  command = "sh scripts/build-web.sh"

[[redirects]]
  from = "/api/ice"
  to = "/.netlify/functions/ice"
  status = 200
  force = true

[[redirects]]
  from = "/api/assistant"
  to = "/.netlify/functions/assistant"
  status = 200
  force = true

[[redirects]]
  from = "/api/release"
  to = "/.netlify/functions/release"
  status = 200
  force = true

[[redirects]]
  from = "/api/push"
  to = "/.netlify/functions/push"
  status = 200
  force = true

[[redirects]]
  from = "/api/recovery"
  to = "/.netlify/functions/recovery"
  status = 200
  force = true

[[redirects]]
  from = "/api/link-preview"
  to = "/.netlify/functions/link-preview"
  status = 200
  force = true

[[redirects]]
  from = "/api/doer"
  to = "/.netlify/functions/doer"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"
